<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exercice</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <nav class="navbar navbar-expand-lg navbar-light bg-primary">
            <div class="container-fluid">
                <span class="navbar-brand" href="#">Gestion des naissances</span>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" href="/">Accueil</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/declaration.html">Déclaration</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/contact.html">Contact</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <div class="container-fluid mt-5">
            <div class="row justify-content-center">
                <div class="col-md-4">
                    <h3 class="">Contact</h3>
                    <form class="mt-3">
                        <div class="form-group mb-3">
                            <label for="">Nom : <b class="text-danger">*</b></label>
                            <input type="text" class="form-control" name="firstName" required>
                        </div>
                        <div class="form-group mb-3">
                            <label for="">Prénom : <b class="text-danger">*</b></label>
                            <input type="text" class="form-control" name="lastName" required>
                        </div>

                        <div class="form-group mb-3">
                            <label for="">Sexe : <b class="text-danger">*</b></label>
                            <select name="sexe" id="" class="form-control">
                                <option selected>-- Choisir votre sexe --</option>
                                <option value="M">-- Masculin --</option>
                                <option value="F">-- Féminin --</option>
                            </select>
                        </div>

                        <div class="form-group mb-3">
                            <label for="">Email : <b class="text-danger">*</b></label>
                            <input type="email" class="form-control" name="email" required>
                        </div>

                        <div class="form-group mb-3">
                            <label for="">Message : <b class="text-danger">*</b></label>
                            <textarea class="form-control" name="message" id="" rows="3" name="message"
                                required></textarea>
                        </div>

                        <div class="text-center">
                            <button type="button" class="btn btn-primary">Envoyer</button>
                        </div>

                    </form>

                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer bg-primary">
            <p class="text">Copiryght | primsoft.technology</p>
        </div>
    </footer>

</body>

</html>
